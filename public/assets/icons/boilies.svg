<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glossy1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFDD99"/>
      <stop offset="100%" style="stop-color:#FFB703"/>
    </radialGradient>
    <radialGradient id="glossy2" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF006E"/>
    </radialGradient>
    <radialGradient id="glossy3" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFEB3B"/>
      <stop offset="100%" style="stop-color:#FFB703"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Boilie 1 -->
  <circle cx="20" cy="25" r="8" fill="url(#glossy1)" filter="url(#shadow)"/>
  <circle cx="18" cy="23" r="2" fill="#FFFFFF" opacity="0.7"/>
  <!-- Boilie 2 -->
  <circle cx="35" cy="30" r="8" fill="url(#glossy2)" filter="url(#shadow)"/>
  <circle cx="33" cy="28" r="2" fill="#FFFFFF" opacity="0.7"/>
  <!-- Boilie 3 -->
  <circle cx="45" cy="35" r="8" fill="url(#glossy3)" filter="url(#shadow)"/>
  <circle cx="43" cy="33" r="2" fill="#FFFFFF" opacity="0.7"/>
</svg>