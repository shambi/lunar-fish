<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#718096"/>
      <stop offset="50%" style="stop-color:#4A5568"/>
      <stop offset="100%" style="stop-color:#2D3748"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Weight shape -->
  <ellipse cx="32" cy="32" rx="6" ry="12" fill="url(#leadGrad)" filter="url(#shadow)"/>
  <!-- Hole -->
  <circle cx="32" cy="22" r="1.5" fill="#A0AEC0"/>
  <!-- Highlight -->
  <ellipse cx="30" cy="28" rx="2" ry="4" fill="#A0AEC0" opacity="0.5"/>
</svg>