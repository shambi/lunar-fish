<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#718096"/>
      <stop offset="50%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2D3748"/>
