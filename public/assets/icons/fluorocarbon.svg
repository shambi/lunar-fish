<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#0099CC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Spool body -->
  <rect x="20" y="25" width="24" height="14" fill="#2C3E50" rx="2" filter="url(#shadow)"/>
  <!-- Top and bottom -->
  <ellipse cx="32" cy="25" rx="12" ry="3" fill="#2C3E50"/>
  <ellipse cx="32" cy="39" rx="12" ry="3" fill="#2C3E50"/>
  <!-- Wound line -->
  <ellipse cx="32" cy="32" rx="10" ry="5" fill="none" stroke="url(#lineGrad)" stroke-width="1"/>
  <ellipse cx="32" cy="32" rx="8" ry="4" fill="none" stroke="url(#lineGrad)" stroke-width="1"/>
  <ellipse cx="32" cy="32" rx="6" ry="3" fill="none" stroke="url(#lineGrad)" stroke-width="1"/>
  <!-- Label -->
  <rect x="26" y="28" width="12" height="6" fill="#FFFFFF" rx="1"/>
  <text x="32" y="33" text-anchor="middle" font-size="4" fill="#2C3E50">0.16</text>
</svg>