<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shallowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="50%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
  </defs>

  <!-- Water surface -->
  <rect x="0" y="50" width="64" height="14" fill="url(#shallowGrad)"/>

  <!-- Shallow depth lines -->
  <line x1="10" y1="55" x2="54" y2="55" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="10" y1="60" x2="54" y2="60" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

  <!-- Depth indicator -->
  <text x="32" y="35" font-family="Arial" font-size="8" fill="#0277BD" text-anchor="middle" font-weight="bold">SHALLOW</text>
  <text x="32" y="42" font-family="Arial" font-size="6" fill="#4FC3F7" text-anchor="middle">WATER</text>

  <!-- Fish near surface -->
  <ellipse cx="25" cy="52" rx="5" ry="2.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="30" cy="51" r="0.8" fill="#FFFFFF" opacity="0.5"/>
</svg>