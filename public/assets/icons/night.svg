<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moonGrad" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#E8EAF6"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </radialGradient>
    <radialGradient id="nightSky" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="100%" stop-color="#000051"/>
    </radialGradient>
  </defs>

  <!-- Night sky background -->
  <rect x="0" y="0" width="64" height="64" fill="url(#nightSky)"/>

  <!-- Moon -->
  <circle cx="45" cy="25" r="10" fill="url(#moonGrad)"/>
  <circle cx="42" cy="22" r="8" fill="url(#nightSky)" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="15" cy="15" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="25" cy="10" r="0.8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="50" cy="12" r="1.2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="10" cy="35" r="0.7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="55" cy="40" r="1" fill="#FFFFFF" opacity="0.7"/>

  <!-- Time indicator -->
  <text x="32" y="55" font-family="Arial" font-size="7" fill="#B0BEC5" text-anchor="middle" font-weight="bold">NIGHT</text>
</svg>