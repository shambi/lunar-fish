<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spinnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#8B9DC3"/>
      <stop offset="100%" stop-color="#5C6B7D"/>
    </linearGradient>
  </defs>

  <!-- Spinner body -->
  <circle cx="32" cy="32" r="6" fill="url(#spinnerGrad)"/>

  <!-- Spinner blades -->
  <ellipse cx="32" cy="20" rx="8" ry="3" fill="url(#bladeGrad)" transform="rotate(0 32 32)"/>
  <ellipse cx="44" cy="32" rx="8" ry="3" fill="url(#bladeGrad)" transform="rotate(90 32 32)"/>
  <ellipse cx="32" cy="44" rx="8" ry="3" fill="url(#bladeGrad)" transform="rotate(180 32 32)"/>
  <ellipse cx="20" cy="32" rx="8" ry="3" fill="url(#bladeGrad)" transform="rotate(270 32 32)"/>

  <!-- Hook -->
  <path d="M 32 38 L 32 46 Q 32 50, 36 51 Q 38 51, 38 49"
        stroke="#8B9DC3"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"/>
  <circle cx="32" cy="46" r="1.5" stroke="#8B9DC3" stroke-width="1.2" fill="none"/>
</svg>